<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Agrícola — Ingreso</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6f4;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
  }
  .card h1 {
    font-size: 20px;
    color: #2d3b2d;
    margin-bottom: 4px;
  }
  .card p.subtitle {
    font-size: 13px;
    color: #7a8a7a;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #445044;
    margin-bottom: 6px;
    font-weight: 600;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d8ded8;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 18px;
    outline: none;
  }
  input:focus { border-color: #4a7c4a; }
  button {
    width: 100%;
    padding: 11px;
    background: #3d6b3d;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #345c34; }
  button:disabled { background: #a5b5a5; cursor: not-allowed; }
  .error {
    background: #fdecea;
    color: #b3261e;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Sistema Agrícola</h1>
  <p class="subtitle">Ingresa con tu correo y contraseña</p>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <label for="email">Correo</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" id="submitBtn">Ingresar</button>
  </form>
</div>

<script>
  const SUPABASE_URL = 'https://fnnbslztdlumkwrxgmns.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZubmJzbHp0ZGx1bWt3cnhnbW5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NDYxNjYsImV4cCI6MjEwMDQyMjE2Nn0.HOSw8d5PAf55yYa4dR-V2LXjfcLKaF92357DAkgayrc';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  // Si ya hay sesión activa, saltar directo al dashboard
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = 'dashboard.html';
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Ingresando...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errorBox.textContent = 'Correo o contraseña incorrectos.';
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Ingresar';
      return;
    }

    window.location.href = 'dashboard.html';
  });
</script>

</body>
</html>
